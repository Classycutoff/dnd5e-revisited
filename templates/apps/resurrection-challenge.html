<form>
  <h2>Resurrection Challenge for {{actor.name}}</h2>
  <p>Base Difficulty Class: {{difficultyClass}}</p>
  
  <div class="form-group">
    <label>Contribution Skill Check:</label>
    <select name="skill">
      {{#each actor.system.skills as |skill key|}}
        <option value="{{key}}">{{skill.label}}</option>
      {{/each}}
    </select>
    <input type="number" name="dc" value="{{difficultyClass}}" />
    <button type="button" class="contribution-check">Make Check</button>
  </div>

  <h3>Contribution Results:</h3>
  <ul>
    {{#each contributionChecks}}
      <li>{{this.skill}}: {{this.result}} ({{#if this.success}}Success{{else}}Failure{{/if}})</li>
    {{/each}}
  </ul>

  {{#if (eq contributionChecks.length 3)}}
    <button type="button" class="perform-resurrection">Perform Resurrection</button>
  {{/if}}
</form>
